# Sandbox kit for the Claude Code image (image/claude/debian-13/claude-dev.yaml).
# The DHI definition is the content; the dhi/build frontend fills version,
# author, source and the deb/ provides from what the build knows.
#
# Mirrors examples/claude/claude.yaml in github.com/docker/sandbox-kit-spec:
# keep the capabilities block identical so both kits behave the same,
# except for the apt mirrors, which are the ones this image's sources name,
# and the agent context, which describes this image.
schemaVersion: "3"
displayName: Claude Code
description: Anthropic's Claude Code agent on Docker Hardened Images
licenses: ['SEE LICENSE IN https://github.com/anthropics/claude-code/blob/main/LICENSE.md']
kind: workload
# The version is the definition's VERSION var: the Claude Code release the
# image installs, validated here and expanded into the provide. Model
# selection is create-phase: `--kit-arg model=… reasoningEffort=…`, or a
# kits[] entry's args in sbxenv.yaml. Empty leaves Claude Code's own
# default. Both are also exported into the sandbox environment, so a shell
# inside can read what the session was created with.
args:
    version:
        required: true
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        description: Claude Code release the image carries
        buildArg: VERSION
    model:
        default: ""
        pattern: '^[A-Za-z0-9._-]*$'
        description: Claude model to use (settings.json `model`); empty keeps the CLI default
        env: CLAUDE_MODEL
    reasoningEffort:
        default: ""
        enum: ["", low, medium, high, xhigh, max, auto]
        description: Effort level (settings.json `effortLevel`); empty keeps the CLI default
        env: CLAUDE_REASONING_EFFORT
version: 2.1.319
